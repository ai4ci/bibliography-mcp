name: Publish executable JAR

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.0'
# tags syntax see https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#filter-pattern-cheat-sheet

# --- CONCURRENCY LOCK ---
# Groups runs by the branch/ref. If multiple tags are pushed,
# older active jobs on the same branch are instantly cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - run: mvn --batch-mode --no-transfer-progress clean package

      - run: mkdir staging && cp target/*.jar staging
      - uses: actions/upload-artifact@v7
        with:
          name: Package
          path: staging
          retention-days: 1
      - uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          files: staging/*.jar


